name: Stan
description: 'Stan (stan.store) is an all-in-one creator storefront and link-in-bio
  commerce platform that lets creators sell digital products, online courses, coaching
  calls, memberships, and webinars directly from a single mobile-first store link.
  The platform bundles checkout and payments, email marketing, an AutoDM tool, analytics,
  and integrations with third-party tools such as Zoom and Google Meet. Backed by
  Forerunner Ventures, General Catalyst, and Norwest Venture Partners, Stan targets
  the creator economy. As of this enrichment pass Stan publishes no public developer
  API, webhook specification, or SDKs — the surface is a consumer product plus a help
  center; this profile captures the identity and a probed domain-security profile.'
